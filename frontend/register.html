<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Corely | Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">

        <div class="auth-logo">
            C
        </div>

    </div>


    <h1>
        Create your account
    </h1>

    <p class="auth-subtitle">
        Start building your adaptive student life.
    </p>


    <form id="registerForm"
          novalidate>


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                autocomplete="name"
                placeholder="Your full name"
                required>

            <div class="form-error"
                 id="nameError">
            </div>

        </div>


        <div class="form-group">

            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Your student ID"
                required>

            <div class="form-error"
                 id="studentIdError">
            </div>

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="you@example.com"
                required>

            <div class="form-error"
                 id="emailError">
            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                autocomplete="new-password"
                placeholder="Minimum 8 characters"
                required>

            <div class="form-error"
                 id="passwordError">
            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                autocomplete="new-password"
                placeholder="Re-enter your password"
                required>

            <div class="form-error"
                 id="confirmPasswordError">
            </div>

        </div>


        <button
            type="submit"
            class="auth-button">

            Create Account

        </button>

    </form>


    <div class="auth-footer">

        Already have an account?

        <a href="login.html">
            Sign in
        </a>

    </div>


    <div class="demo-note">

        Your information will be securely
        connected to the Corely backend.

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
