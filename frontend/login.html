<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to Corely"
    >

    <title>Corely | Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <main class="auth-container">


        <!-- LOGO -->

        <div class="auth-brand">

            <div class="auth-logo">
                C
            </div>

        </div>


        <!-- TITLE -->

        <h1>
            Welcome back
        </h1>


        <p class="auth-subtitle">
            Sign in to continue to your Corely dashboard.
        </p>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            novalidate
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

                <div
                    class="form-error"
                    id="emailError"
                ></div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <div
                    class="form-error"
                    id="passwordError"
                ></div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="auth-button"
            >
                Sign In
            </button>


        </form>


        <!-- REGISTER LINK -->

        <div class="auth-footer">

            Don't have a Corely account?

            <a href="register.html">
                Create one
            </a>

        </div>


        <!-- BACK TO HOME -->

        <div
            class="auth-footer"
            style="margin-top: 10px;"
        >

            <a href="index.html">
                ← Back to Corely
            </a>

        </div>


    </main>


    <!-- API MUST LOAD FIRST -->

    <script src="js/api.js"></script>

    <!-- AUTH LOGIC -->

    <script src="js/auth.js"></script>


</body>

</html>
